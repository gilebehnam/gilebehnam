<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Behnam Jafari Balalami, founder of Whalya Venture Studio: Whalyom, Whalory, Whalyon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090D10"/>
      <stop offset="1" stop-color="#0C1B20"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E4BE4B"/>
      <stop offset="1" stop-color="#AD9570"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#8EDDE2" stop-opacity=".22"/><stop offset="1" stop-color="#8EDDE2" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#10262C" stroke-width="1"/>
    </pattern>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
      .blink{animation:b 1.1s steps(1) infinite}
      @keyframes b{50%{opacity:0}}
      .dot{animation:p 3s ease-in-out infinite}
      @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
      .pulse{animation:q 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes q{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.6);opacity:0}}
    </style>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)" opacity=".7"/>

  <!-- Whalya: the ventures as faint stars, the three products bright and named -->
  <circle cx="1010" cy="170" r="150" fill="url(#glow)"/>
  <g fill="#A8B8BA">
    <circle class="dot" cx="900" cy="70" r="2"/><circle class="dot" cx="1150" cy="60" r="2" style="animation-delay:.6s"/>
    <circle class="dot" cx="880" cy="250" r="2" style="animation-delay:1.2s"/><circle class="dot" cx="1160" cy="290" r="2" style="animation-delay:1.8s"/>
    <circle class="dot" cx="1140" cy="190" r="2" style="animation-delay:2.4s"/><circle class="dot" cx="960" cy="30" r="2" style="animation-delay:.3s"/>
  </g>
  <path d="M940 120L1080 90L1050 240Z" fill="none" stroke="#AD9570" stroke-opacity=".45" stroke-width="1.2"/>
  <g class="sans" font-size="15" font-weight="600" letter-spacing="2">
    <circle cx="940" cy="120" r="12" fill="#E4BE4B" class="pulse"/><circle cx="940" cy="120" r="6" fill="#E4BE4B"/>
    <text x="940" y="152" fill="#D5D3C8" text-anchor="middle">WHALYOM</text>
    <circle cx="1080" cy="90" r="12" fill="#8EDDE2" class="pulse" style="animation-delay:.9s"/><circle cx="1080" cy="90" r="6" fill="#8EDDE2"/>
    <text x="1080" y="68" fill="#D5D3C8" text-anchor="middle">WHALORY</text>
    <circle cx="1050" cy="240" r="12" fill="#AD9570" class="pulse" style="animation-delay:1.8s"/><circle cx="1050" cy="240" r="6" fill="#AD9570"/>
    <text x="1050" y="274" fill="#D5D3C8" text-anchor="middle">WHALYON</text>
  </g>

  <text x="64" y="84" class="mono" font-size="15" letter-spacing="3" fill="#E4BE4B">WHALYA / VENTURE STUDIO<tspan class="blink"> ▍</tspan></text>
  <text x="62" y="158" class="sans" font-size="54" font-weight="800" fill="#F4F2EC">Behnam Jafari Balalami</text>
  <text x="64" y="202" class="sans" font-size="24" font-weight="500" fill="#D5D3C8">Founder, Whalya Venture Studio</text>
  <rect x="64" y="226" width="120" height="4" rx="2" fill="url(#accent)"/>
  <text x="64" y="268" class="sans" font-size="17" fill="#A8B8BA">Whalyom · a marketing department in Claude Code</text>
  <text x="64" y="294" class="sans" font-size="17" fill="#A8B8BA">Whalory · copy that sounds like you   ·   Whalyon · business health</text>
</svg>
