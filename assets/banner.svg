<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Behnam Jafari Balalami — Product &amp; Operations Executive">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F17"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5B544"/>
      <stop offset="1" stop-color="#F0703C"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1F2937" stroke-width="1"/>
    </pattern>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
      .blink{animation:b 1.1s steps(1) infinite}
      @keyframes b{50%{opacity:0}}
      .rise{animation:r 1.2s ease-out both}
      .rise2{animation:r 1.2s .25s ease-out both}
      .rise3{animation:r 1.2s .5s ease-out both}
      @keyframes r{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
      .dot{animation:p 3s ease-in-out infinite}
      @keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
    </style>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)" opacity=".55"/>

  <!-- constellation: 20 ventures -->
  <g fill="#F5B544">
    <circle class="dot" cx="930" cy="70" r="3"/>
    <circle class="dot" cx="1010" cy="110" r="4" style="animation-delay:.4s"/>
    <circle class="dot" cx="1090" cy="80" r="3" style="animation-delay:.8s"/>
    <circle class="dot" cx="960" cy="170" r="5" style="animation-delay:1.2s"/>
    <circle class="dot" cx="1060" cy="200" r="3" style="animation-delay:1.6s"/>
    <circle class="dot" cx="1130" cy="160" r="4" style="animation-delay:2s"/>
    <circle class="dot" cx="1000" cy="260" r="3" style="animation-delay:2.4s"/>
    <circle class="dot" cx="1110" cy="270" r="5" style="animation-delay:.2s"/>
  </g>
  <g stroke="#F5B544" stroke-opacity=".25" stroke-width="1" fill="none">
    <path d="M930 70L1010 110L1090 80M1010 110L960 170L1060 200L1130 160L1090 80M1060 200L1000 260M1060 200L1110 270"/>
  </g>

  <text x="64" y="84" class="mono rise" font-size="15" letter-spacing="3" fill="#F5B544">BEHNAAM / CONSTRUCTIVE INTELLIGENCE<tspan class="blink"> ▍</tspan></text>
  <text x="62" y="160" class="sans rise2" font-size="54" font-weight="800" fill="#F9FAFB">Behnam Jafari Balalami</text>
  <text x="64" y="206" class="sans rise2" font-size="24" font-weight="500" fill="#CBD5E1">Product &amp; Operations Executive · Founder, Whalyon · Co-founder, VOHU</text>
  <rect x="64" y="232" width="120" height="4" rx="2" fill="url(#accent)" class="rise3"/>
  <text x="64" y="284" class="mono rise3" font-size="16" fill="#94A3B8">18+ yrs · 20 ventures · 1,000B+ Tomans GTV · 626K+ users in 6 months</text>
</svg>
